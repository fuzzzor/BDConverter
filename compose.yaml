---
services:
  bdconverter:
    build: .
    container_name: bdconverter
    ports:
      - "3111:3111"
    volumes:
      - /volume1/fichiers/amule/bdconverter:/app/output
    # - /volume1/docker/bdconverter/output:/app/output
      - /volume1/docker/bdconverter/upload:/app/upload
      - /volume1/docker/bdconverter/temp:/app/temp
    environment:
      - NODE_ENV=production
      - THEME=comic           # Choose theme: 'default' or 'neon'
      - LOGS=info               # Optional: Log level (info or debug)
      - PUID=1000
      - PGID=100
      - TIMEZONE=Europe/Paris
      # Optional: Custom directories
      # - OUTPUT_DIR=/app/output
      # - UPLOAD_DIR=/app/upload
      # - TEMP_DIR=/app/temp
      
      # Optional: Enable/disable progress thumbnail feature
      # - FEATURE_PROGRESS_THUMBNAIL=1
    restart: unless-stopped